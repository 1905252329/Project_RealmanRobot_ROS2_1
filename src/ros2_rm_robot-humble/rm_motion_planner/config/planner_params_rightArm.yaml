# 示例参数文件，展示不同的关节角度配置
# 此文件可用于测试不同的运动规划场景

rm_sclerp_planner_node_rightArm:
  ros__parameters:
    # 起始关节角度 (弧度)
    # 遮挡相机
    start_joint_positions:  "-0.924, 1.504, -0.371, 1.876, -0.962, 1.126, -0.046"
    # 不遮挡相机
    start_joint_positions:  "-0.782, 1.205, -0.852, 1.247, -0.698, 1.456, -1.095"
    
    # 目标关节角度 (弧度)
    # 示例1: 简单移动
    target_joint_positions: "-1.473, 1.868, -0.651, 0.330, -0.871, 1.490, -1.036"
    
    # URDF文件路径（必须提供有效的URDF文件路径）
    urdf_path: "/home/byd/hrt2/ros2_rm_ws/src/ros2_rm_robot-humble/rm_description/urdf/rm_75_6fb.urdf"
    
    # 轨迹执行频率 (Hz) - 控制定时器发布轨迹点的频率
    trajectory_execution_rate: 25
    
    # 轨迹插值频率 (Hz) - 控制轨迹点插值的密度
    trajectory_interpolation_rate: 100